@let text = value();

<div class="search" [class]="'search--' + variant()">
  <label class="search__icon" aria-hidden="true" [for]="inputId()"
    ><app-icon name="search"
  /></label>
  <label class="sr-only" [for]="inputId()">{{ label() }}</label>
  <input
    #inputEl
    class="search__input"
    [id]="inputId()"
    type="search"
    [value]="text"
    [placeholder]="placeholder()"
    [disabled]="disabled()"
    (input)="onInput($event)"
    (keydown.escape)="onEscape($event)"
  />
  @if (loading()) {
    <span class="search__spinner" aria-hidden="true"></span>
  } @else if (text) {
    <button
      type="button"
      class="search__clear focus-ring"
      aria-label="Limpiar"
      [disabled]="disabled()"
      (click)="clear()"
    >
      <app-icon name="x" [size]="14" />
    </button>
  } @else if (effectiveShortcut().length && !disabled()) {
    <app-kbd class="search__kbd" [keys]="effectiveShortcut()" />
  }
</div>
