<section class="requirements" [attr.aria-labelledby]="titleId">
  <p class="requirements__title" [id]="titleId">{{ title() }}</p>

  <ul class="requirements__list">
    @for (requirement of requirements(); track requirement.label) {
      <li class="requirements__item" [class.requirements__item--met]="requirement.met">
        <app-icon [name]="requirement.met ? 'circle-check' : 'circle'" [size]="14" />
        <span>{{ requirement.label }}</span>
        <!-- El color y el icono no llegan a un lector de pantalla; el estado, sí. -->
        <span class="sr-only">{{ requirement.met ? '(cumplido)' : '(pendiente)' }}</span>
      </li>
    }
  </ul>
</section>
