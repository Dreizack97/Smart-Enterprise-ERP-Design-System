<app-field
  [label]="label()"
  [controlId]="inputId()"
  [required]="required()"
  [hint]="hint()"
  [error]="message()"
  [errorId]="errorId()"
>
  <div class="password-wrap">
    <span class="field-affix field-affix--start"><app-icon name="lock" /></span>

    <input
      class="field-control password-wrap__control"
      [id]="inputId()"
      [type]="revealed() ? 'text' : 'password'"
      [value]="value()"
      [placeholder]="placeholder()"
      [disabled]="disabled()"
      [required]="required()"
      [attr.name]="name() || null"
      [attr.autocomplete]="autocomplete()"
      [attr.aria-invalid]="message() ? 'true' : null"
      [attr.aria-describedby]="message() ? errorId() : null"
      (input)="onInput($event)"
      (blur)="onBlur()"
    />

    <button
      type="button"
      class="password-wrap__toggle focus-ring"
      [attr.aria-label]="toggleLabel()"
      [attr.aria-pressed]="revealed()"
      [disabled]="disabled()"
      (click)="toggleReveal()"
    >
      <app-icon [name]="revealed() ? 'eye-off' : 'eye'" />
    </button>
  </div>
</app-field>
