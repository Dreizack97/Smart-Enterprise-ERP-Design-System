<div class="state">
  <span class="state__badge"><app-icon [name]="icon()" [size]="22" /></span>
  <p class="state__title">{{ title() }}</p>
  @if (description(); as text) {
    <p class="state__description">{{ text }}</p>
  }
  <div class="state__actions"><ng-content select="[actions]" /></div>
</div>
