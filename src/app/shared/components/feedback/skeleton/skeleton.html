<div class="flex flex-col gap-2" role="status" aria-busy="true" aria-label="Cargando contenido">
  @for (row of rows(); track $index) {
    <span
      class="skeleton"
      [class]="'skeleton--' + shape()"
      [class.skeleton--short]="isLastOfMany($index)"
      [style.height]="customHeight()"
    ></span>
  }
</div>
