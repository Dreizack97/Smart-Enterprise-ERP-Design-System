@let left = remaining();

<div class="resend" role="status" aria-live="polite">
  @if (left > 0) {
    <span>
      Puedes solicitar un nuevo envío en
      <span class="resend__count">{{ left }}</span>
      s
    </span>
  } @else {
    <app-button
      variant="link"
      size="sm"
      icon="refresh-cw"
      [loading]="resending()"
      (pressed)="onResend()"
    >
      {{ label() }}
    </app-button>
  }
</div>
