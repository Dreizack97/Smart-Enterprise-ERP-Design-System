@let current = value();
@let compact = iconOnly();

<div
  class="segmented"
  [class]="'segmented--' + size()"
  role="group"
  [attr.aria-label]="label() || null"
>
  @for (option of options(); track option.value) {
    <button
      type="button"
      class="segment focus-ring"
      [class.segment--active]="option.value === current"
      [attr.aria-pressed]="option.value === current"
      [attr.aria-label]="compact ? option.label : null"
      [disabled]="disabled() || !!option.disabled"
      (click)="select(option)"
    >
      @if (option.icon; as name) {
        <app-icon [name]="name" />
      }
      @if (!compact) {
        <span>{{ option.label }}</span>
      }
    </button>
  }
</div>
