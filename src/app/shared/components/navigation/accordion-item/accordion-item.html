<button
  ngAccordionTrigger
  type="button"
  class="trigger focus-ring"
  [panel]="panel"
  [disabled]="disabled()"
>
  <span class="trigger__label">
    @if (icon(); as name) {
      <app-icon [name]="name" [size]="16" />
    }
    {{ label() }}
  </span>
  <app-icon class="trigger__chevron" name="chevron-down" [size]="16" />
</button>

<div ngAccordionPanel #panel="ngAccordionPanel" class="panel">
  <ng-template ngAccordionContent>
    <ng-content />
  </ng-template>
</div>
