<button
  ngAccordionTrigger
  type="button"
  class="trigger focus-ring"
  [panel]="panel"
  [disabled]="disabled()"
  [(expanded)]="expanded"
>
  <span class="trigger__label">
    @if (icon(); as name) {
      <app-icon [name]="name" [size]="16" />
    }
    <span class="trigger__text">
      <span>{{ label() }}</span>
      @if (summary()) {
        <span class="trigger__summary">{{ summary() }}</span>
      }
    </span>
  </span>
  @if (modified()) {
    <span class="trigger__modified">Sin guardar</span>
  }
  <app-icon class="trigger__chevron" name="chevron-down" [size]="16" />
</button>

<div ngAccordionPanel #panel="ngAccordionPanel" class="panel" [preserveContent]="preserveContent()">
  <ng-template ngAccordionContent>
    <ng-content />
  </ng-template>
</div>
