@let current = page();

<div
  class="pagination"
  [class.pagination--flush]="flush()"
  [class.pagination--compact]="variant() === 'compact'"
  [class.pagination--sm]="size() === 'sm'"
>
  @if (summary()) {
    <p class="pagination__summary">{{ summary() }}</p>
  }

  @if (navigable()) {
    <nav class="pagination__nav" aria-label="Paginación">
      <button
        type="button"
        class="pagination__step focus-ring"
        [disabled]="isFirst()"
        aria-label="Página anterior"
        (click)="previous()"
      >
        <app-icon name="chevron-left" [size]="size() === 'sm' ? 12 : 14" />
      </button>

      @if (variant() === 'compact') {
        <span class="pagination__counter" aria-live="polite">
          {{ current }} / {{ pageCount() }}
        </span>
      } @else {
        @for (slot of slots(); track $index) {
          @if (slot === gap) {
            <span class="pagination__gap" aria-hidden="true">…</span>
          } @else {
            <button
              type="button"
              class="pagination__page focus-ring"
              [class.pagination__page--active]="slot === current"
              [attr.aria-current]="slot === current ? 'page' : null"
              [attr.aria-label]="'Página ' + slot"
              (click)="goTo(+slot)"
            >
              {{ slot }}
            </button>
          }
        }
      }

      <button
        type="button"
        class="pagination__step focus-ring"
        [disabled]="isLast()"
        aria-label="Página siguiente"
        (click)="next()"
      >
        <app-icon name="chevron-right" [size]="size() === 'sm' ? 12 : 14" />
      </button>
    </nav>
  }
</div>
