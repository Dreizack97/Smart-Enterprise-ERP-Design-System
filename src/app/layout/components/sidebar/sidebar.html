<div class="sidebar__search">
  <app-search-input
    #searchField
    class="sidebar__search-field"
    variant="field"
    label="Buscar"
    placeholder="Buscar"
    [shortcut]="['Ctrl', 'K']"
    [(value)]="query"
    (keydown.escape)="clearSearch()"
  />
  <button
    type="button"
    class="sidebar__search-trigger focus-ring"
    aria-label="Buscar"
    (click)="requestSearch()"
  >
    <app-icon name="search" [size]="18" />
  </button>
</div>

<nav class="sidebar__nav" aria-label="Navegación principal">
  @for (section of visibleSections(); track $index) {
    <div class="sidebar__section" [style.--section-index]="$index">
      @if (section.title; as title) {
        <p class="sidebar__section-title">{{ title }}</p>
      }
      <ul class="sidebar__list">
        @for (item of section.items; track item.id) {
          <app-sidebar-nav-item
            [item]="item"
            [siblingIds]="topLevelIds()"
            [depth]="0"
            [rail]="rail()"
            [query]="query()"
            (navigated)="clearSearch()"
          />
        }
      </ul>
    </div>
  } @empty {
    <div class="sidebar__empty" role="status">
      <app-icon class="sidebar__empty-icon" name="search" [size]="24" />
      <p class="sidebar__empty-title">Sin resultados</p>
      <p class="sidebar__empty-text">Nada en el menú coincide con "{{ query() }}".</p>
    </div>
  }
</nav>
